plugins { id 'com.android.application' }
android {
    namespace 'gr.anelix.velatune'
    compileSdk 35
    ndkVersion '27.2.12479018'
    useLibrary 'android.test.runner'
    useLibrary 'android.test.base'
    useLibrary 'android.test.mock'
    defaultConfig {
        applicationId 'gr.anelix.velatune'
        minSdk 27
        targetSdk 35
        versionCode 1
        versionName '0.1.0-validation'
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64' }
        externalNativeBuild { cmake { cppFlags '-std=c++17 -O3 -Wall -Wextra'; arguments '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON', '-DANDROID_STL=c++_shared' } }
        testInstrumentationRunner 'android.test.InstrumentationTestRunner'
    }
    buildFeatures { prefab true }
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
    buildTypes {
        debug { applicationIdSuffix '.validation' }
        release { minifyEnabled true; shrinkResources true; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro' }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    lint { abortOnError true; checkReleaseBuilds true }
}
dependencies { implementation 'com.google.oboe:oboe:1.9.3' }
